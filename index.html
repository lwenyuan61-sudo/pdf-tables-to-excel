<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PDF to Excel — free, private table converter</title>
<meta name="description" content="Convert PDF tables to Excel (.xlsx) or CSV for free. Works on scanned PDFs too. Runs entirely in your browser — your files are never uploaded.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23217346'/%3E%3Cpath d='M8 9h16M8 16h16M8 23h16M14 6v20' stroke='%23fff' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
:root{color-scheme:light;--bg:#f7f7f5;--card:#fff;--ink:#1d1d1b;--mute:#6b6b66;--line:#e3e2dd;--acc:#217346;--acc-ink:#fff;--soft:#eef5f0;--warn:#9a5b00}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#151614;--card:#1e1f1d;--ink:#ecebe6;--mute:#a3a29b;--line:#33342f;--acc:#3fa36a;--acc-ink:#0d130f;--soft:#1f2b23;--warn:#e0a14a}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#151614;--card:#1e1f1d;--ink:#ecebe6;--mute:#a3a29b;--line:#33342f;--acc:#3fa36a;--acc-ink:#0d130f;--soft:#1f2b23;--warn:#e0a14a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,"PingFang SC","Microsoft YaHei",sans-serif}
main{max-width:860px;margin:0 auto;padding:40px 16px 56px}
h1{font-size:30px;line-height:1.15;margin:0 0 6px;letter-spacing:-.01em}
.sub{color:var(--mute);margin:0 0 28px}
.drop{display:block;border:2px dashed var(--line);border-radius:14px;background:var(--card);padding:40px 20px;text-align:center;cursor:pointer;transition:border-color .15s,background .15s}
.drop:hover,.drop.over{border-color:var(--acc);background:var(--soft)}
.drop b{display:block;font-size:18px;margin-bottom:4px}
.drop span{color:var(--mute);font-size:14px}
input[type=file]{display:none}
.opts{display:flex;flex-wrap:wrap;gap:10px 22px;margin:18px 2px 0;font-size:14px;color:var(--mute)}
.opts label{display:flex;align-items:center;gap:7px;cursor:pointer}
.opts select{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:6px;padding:2px 6px}
#status{margin:22px 2px 0;font-size:14px;color:var(--mute);min-height:21px}
#status.err{color:var(--warn)}
.bar{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:8px;display:none}
.bar i{display:block;height:100%;width:0;background:var(--acc);transition:width .2s}
#out{display:none;margin-top:24px}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.btn{font:inherit;font-weight:600;border:0;border-radius:9px;padding:10px 18px;background:var(--acc);color:var(--acc-ink);cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);font-weight:500}
.btn:focus-visible,.drop:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
#sheet{font:inherit;font-size:14px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-left:auto;max-width:100%}
.wrap{margin-top:14px;border:1px solid var(--line);border-radius:12px;background:var(--card);overflow:auto;max-height:60vh}
table{border-collapse:collapse;font-size:13px;width:max-content;min-width:100%}
td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:5px 9px;white-space:nowrap;max-width:340px;overflow:hidden;text-overflow:ellipsis}
td.n{text-align:right;font-variant-numeric:tabular-nums}
.note{font-size:13px;color:var(--mute);margin-top:10px}
footer{margin-top:44px;padding-top:18px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;font-size:14px;color:var(--mute)}
footer a{color:inherit}
.donate{display:none;align-items:center;gap:8px;text-decoration:none;color:var(--ink)!important;border:1px solid var(--line);border-radius:999px;padding:7px 14px;background:var(--card)}
.donate:hover{border-color:var(--acc)}
.sp{flex:1}
</style>
</head>
<body>
<main>
  <h1>PDF to Excel</h1>
  <p class="sub">Free. Turns the tables in your PDF into an Excel file. Scanned PDFs work too. Everything runs in your browser — your files are never uploaded.</p>

  <label class="drop" id="drop" tabindex="0">
    <b>Drop PDF files here</b>
    <span>or click to choose</span>
    <input type="file" id="file" accept="application/pdf,.pdf" multiple>
  </label>

  <div class="opts">
    <label><input type="radio" name="mode" value="page" checked> One sheet per page</label>
    <label><input type="radio" name="mode" value="all"> All pages in one sheet</label>
    <label><input type="checkbox" id="num" checked> Convert numbers</label>
    <label>Scanned pages:
      <select id="lang">
        <option value="eng">English</option>
        <option value="eng+chi_sim">English + 简体中文</option>
        <option value="eng+chi_tra">English + 繁體中文</option>
        <option value="eng+fra+deu+spa">English + FR / DE / ES</option>
      </select>
    </label>
  </div>

  <div id="status" role="status" aria-live="polite"></div>
  <div class="bar" id="bar"><i></i></div>

  <section id="out">
    <div class="row">
      <button class="btn" id="dl">Download .xlsx</button>
      <button class="btn ghost" id="csv">CSV of this sheet</button>
      <select id="sheet" aria-label="Sheet"></select>
    </div>
    <div class="wrap"><table id="prev"></table></div>
    <div class="note" id="note"></div>
  </section>

  <footer>
    <span>Made by Wenyuan Li</span>
    <a href="https://github.com/lwenyuan61-sudo/pdf-tables-to-excel">Source</a>
    <span class="sp"></span>
    <a class="donate" id="donate" target="_blank" rel="noopener">☕ Saved you time? Tip $1</a>
  </footer>
</main>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
